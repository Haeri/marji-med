<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#0b2e4a"/></marker>
  </defs>
  <rect width="800" height="340" fill="#eef3f6"/>
  <!-- ECP: cuff outside the limb, force directed inward from outside -->
