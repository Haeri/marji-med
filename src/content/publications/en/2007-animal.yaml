year: 2007
citation: "Walpoth BH, Aregger C, Lapanashvili L, Mettler D, Carrel T, Hess OM. Int J Artif Organs. 2007;30(5):407-14."
title: ECG-triggered muscular counterpulsation for treatment of low cardiac output
design: "Animal study, 8 pigs"
findings: "Under control conditions: pulmonary vascular resistance −18%, systemic vascular resistance −11%. After beta-blockade: heart rate +10%, cardiac index +17%, ejection fraction +5%, pulmonary vascular resistance −19%, systemic vascular resistance −29%."
