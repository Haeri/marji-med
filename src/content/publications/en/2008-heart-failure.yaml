year: 2008
citation: "Lapanashvili L, Buziashvili YI, Matskeplishvili ST, Lobjanidze TG, Bockeria LA, Huber PP, Hess OM, Walpoth BH. Int J Artif Organs. 2008;31(3):244-51."
title: ECG-triggered skeletal muscle stimulation improves hemodynamics and physical performance of heart failure patients
design: "Controlled clinical study, n = 55 (30 MCP, 25 controls)"
findings: "30 minutes over eight days. In patients with EF below 40%: EF +21%, stroke volume +13%, end-systolic volume −23% (all p < 0.001); exercise duration +56%, walking distance +72%. In patients with EF above 40%: EF +6%, stroke volume +8% (p < 0.05)."
pmid: "18373318"
doi: 10.1177/039139880803100308
