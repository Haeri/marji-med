year: 2004
citation: "Tozzi P, Corno AF, Lapanashvili LV, Von Segesser LK. Eur J Cardiothorac Surg. 2004;26(4):726-9."
title: "Muscular counterpulsation: preliminary results of a non-invasive alternative to intra-aortic balloon pump"
design: "Animal study, 6 calves"
findings: "MCP and the intra-aortic balloon pump had the same effects on cardiac output and left ventricular stroke work index. MCP also reduced systemic vascular resistance and increased femoral artery flow, without vascular access or anticoagulation."
pmid: "15450563"
doi: 10.1016/j.ejcts.2004.03.051
