year: 2012
citation: "Ostojic D, Seifert I, Pütz V, Bartsch S, Bitter T, Horstkotte D, Oldenburg O. Artif Organs. 2012;36(6):559-64."
title: Acute effects of muscular counterpulsation therapy on cardiac output and safety in patients with chronic heart failure
design: "Uncontrolled clinical study by an independent group, n = 22"
findings: "45 minutes on three consecutive days in NYHA class II and III, mean EF 29.6%. During treatment: cardiac output +2.08 L/min (p < 0.05), total peripheral resistance −336 dyn·s/cm⁵ (p < 0.05), stroke volume +8.35 mL (not significant), heart rate +17.12 beats per minute (p < 0.05). Cardiac markers stayed normal. No inappropriate sensing or pacing artifacts in patients with implanted rhythm devices."
pmid: "22145938"
doi: 10.1111/j.1525-1594.2011.01399.x
