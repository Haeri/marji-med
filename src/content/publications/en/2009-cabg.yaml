year: 2009
citation: "Lapanashvili LV, Buziashvili YI, Matskeplishvili ST, Lobjanidze TG, Yoshina VI, Kamardinov DK, Tugeeva EF, Bockeria LA. J Card Surg. 2009;24(2):134-40."
title: Therapeutic value of muscular counterpulsation after coronary bypass grafting operation
design: "Randomised study, n = 50 (30 MCP, 20 controls)"
findings: "30 minutes daily for eight postoperative days. Systemic vascular resistance −36% with MCP (p < 0.001), −16% in controls (p = 0.011). Postoperative complications in 1 patient (3%) with MCP, 7 (39%) in controls. Hospital stay 12.0 ± 4.6 days with MCP, 16.8 ± 4.4 days in controls (p < 0.001)."
pmid: "18793232"
doi: 10.1111/j.1540-8191.2008.00725.x
