year: 2017
citation: "Lapanashvili LV, Alshibaya MD, Veselova J, Bockeria LA. Int J Angiol. 2017;26(3):148-157."
title: Acute Beneficial Effects of Muscular Counterpulsation in Patients with Coronary Heart Diseases
design: "Prospective pilot study, n = 17 (10 MCP, 7 controls)"
findings: "A single 15-minute session before anaesthesia in patients with EF ≤45% undergoing elective bypass surgery. Stroke index +10%. After induction: systemic vascular resistance index −28%, mean arterial pressure −10%, left ventricular efficiency +22%. Well tolerated, with no complications."
pmid: "28804232"
doi: 10.1055/s-0036-1593825
