year: 2006
citation: "Shavianidze GO, Lapanashvili LV. Vopr Kurortol Fizioter Lech Fiz Kult. 2006;(5):11-4. In Russian."
title: Muscular contrapulsation in rehabilitation of patients with osteoarthrosis
design: "Clinical study in lower limb osteoarthrosis"
findings: "MCP alone and combined with radon and iodine-bromine baths. Reported analgesic and anti-inflammatory effects with improved locomotor function, muscle tone and haemodynamics. The combination strengthened these effects."
