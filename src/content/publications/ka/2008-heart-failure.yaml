year: 2008
citation: "Lapanashvili L, Buziashvili YI, Matskeplishvili ST, Lobjanidze TG, Bockeria LA, Huber PP, Hess OM, Walpoth BH. Int J Artif Organs. 2008;31(3):244-51."
title: ECG-triggered skeletal muscle stimulation improves hemodynamics and physical performance of heart failure patients
design: "კონტროლირებადი კლინიკური კვლევა, n = 55 (30 MCP, 25 საკონტროლო)"
findings: "30 წუთი რვა დღის განმავლობაში. პაციენტებში, რომელთა განდევნის ფრაქცია 40%-ზე დაბალია: განდევნის ფრაქცია +21%, დარტყმითი მოცულობა +13%, საბოლოო სისტოლური მოცულობა −23% (ყველა p < 0.001); დატვირთვის ხანგრძლივობა +56%, გავლილი მანძილი +72%. პაციენტებში, რომელთა განდევნის ფრაქცია 40%-ზე მაღალია: განდევნის ფრაქცია +6%, დარტყმითი მოცულობა +8% (p < 0.05)."
pmid: "18373318"
doi: 10.1177/039139880803100308
