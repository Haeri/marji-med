title: Muscular contrapulsation in rehabilitation of patients with osteoarthrosis
design: "კლინიკური კვლევა ქვედა კიდურების ოსტეოართროზის დროს"
findings: "MCP დამოუკიდებლად და რადონისა და იოდ-ბრომის აბაზანებთან კომბინაციაში. აღწერილია ანალგეზიური და ანთების საწინააღმდეგო ეფექტები, ლოკომოტორული ფუნქციის, კუნთების ტონუსისა და ჰემოდინამიკის გაუმჯობესებით. კომბინაციამ ეს ეფექტები გააძლიერა."
