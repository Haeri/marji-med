year: 2009
citation: "Lapanashvili LV, Buziashvili YI, Matskeplishvili ST, Lobjanidze TG, Yoshina VI, Kamardinov DK, Tugeeva EF, Bockeria LA. J Card Surg. 2009;24(2):134-40."
title: Therapeutic value of muscular counterpulsation after coronary bypass grafting operation
design: "რანდომიზებული კვლევა, n = 50 (30 MCP, 20 საკონტროლო)"
findings: "30 წუთი ყოველდღიურად, რვა პოსტოპერაციული დღის განმავლობაში. სისტემური სისხლძარღვოვანი რეზისტენტობა −36% MCP-ის ჯგუფში (p < 0.001), −16% საკონტროლო ჯგუფში (p = 0.011). პოსტოპერაციული გართულებები 1 პაციენტში (3%) MCP-ის ჯგუფში, 7 პაციენტში (39%) საკონტროლო ჯგუფში. ჰოსპიტალიზაციის ხანგრძლივობა 12.0 ± 4.6 დღე MCP-ის ჯგუფში, 16.8 ± 4.4 დღე საკონტროლო ჯგუფში (p < 0.001)."
pmid: "18793232"
doi: 10.1111/j.1540-8191.2008.00725.x
