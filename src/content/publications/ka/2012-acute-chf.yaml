year: 2012
citation: "Ostojic D, Seifert I, Pütz V, Bartsch S, Bitter T, Horstkotte D, Oldenburg O. Artif Organs. 2012;36(6):559-64."
title: Acute effects of muscular counterpulsation therapy on cardiac output and safety in patients with chronic heart failure
design: "არაკონტროლირებადი კლინიკური კვლევა, ჩატარებული დამოუკიდებელი ჯგუფის მიერ, n = 22"
findings: "45 წუთი სამი ზედიზედ დღის განმავლობაში, NYHA II და III კლასი, საშუალო განდევნის ფრაქცია 29.6%. მკურნალობის დროს: გულის წუთმოცულობა +2.08 L/min (p < 0.05), საერთო პერიფერიული რეზისტენტობა −336 dyn·s/cm⁵ (p < 0.05), დარტყმითი მოცულობა +8.35 mL (სტატისტიკურად არასარწმუნო), გულისცემის სიხშირე +17.12 დარტყმა წუთში (p < 0.05). გულის მარკერები ნორმის ფარგლებში დარჩა. იმპლანტირებული რიტმის მოწყობილობების მქონე პაციენტებში არაადეკვატური სენსინგი ან პეისინგის არტეფაქტები არ გამოვლენილა."
pmid: "22145938"
doi: 10.1111/j.1525-1594.2011.01399.x
