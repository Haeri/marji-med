year: 2007
citation: "Walpoth BH, Aregger C, Lapanashvili L, Mettler D, Carrel T, Hess OM. Int J Artif Organs. 2007;30(5):407-14."
title: ECG-triggered muscular counterpulsation for treatment of low cardiac output
design: "ცხოველებზე ჩატარებული კვლევა, 8 ღორი"
findings: "საკონტროლო პირობებში: ფილტვის სისხლძარღვოვანი რეზისტენტობა −18%, სისტემური სისხლძარღვოვანი რეზისტენტობა −11%. ბეტა-ბლოკადის შემდეგ: გულისცემის სიხშირე +10%, გულის ინდექსი +17%, განდევნის ფრაქცია +5%, ფილტვის სისხლძარღვოვანი რეზისტენტობა −19%, სისტემური სისხლძარღვოვანი რეზისტენტობა −29%."
pmid: "17551904"
doi: 10.1177/039139880703000508
