year: 2004
citation: "Tozzi P, Corno AF, Lapanashvili LV, Von Segesser LK. Eur J Cardiothorac Surg. 2004;26(4):726-9."
title: "Muscular counterpulsation: preliminary results of a non-invasive alternative to intra-aortic balloon pump"
design: "ცხოველებზე ჩატარებული კვლევა, 6 ხბო"
findings: "MCP-სა და ინტრააორტულ ბალონურ ტუმბოს ერთნაირი გავლენა ჰქონდა გულის წუთმოცულობასა და მარცხენა პარკუჭის დარტყმითი მუშაობის ინდექსზე. MCP-მ ასევე შეამცირა სისტემური სისხლძარღვოვანი რეზისტენტობა და გაზარდა ბარძაყის არტერიის ნაკადი, სისხლძარღვოვანი მიდგომისა და ანტიკოაგულაციის გარეშე."
pmid: "15450563"
doi: 10.1016/j.ejcts.2004.03.051
