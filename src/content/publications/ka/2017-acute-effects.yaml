year: 2017
citation: "Lapanashvili LV, Alshibaya MD, Veselova J, Bockeria LA. Int J Angiol. 2017;26(3):148-157."
title: Acute Beneficial Effects of Muscular Counterpulsation in Patients with Coronary Heart Diseases
design: "პროსპექტული საპილოტე კვლევა, n = 17 (10 MCP, 7 საკონტროლო)"
findings: "ერთი 15-წუთიანი სეანსი ანესთეზიამდე პაციენტებში, რომელთა განდევნის ფრაქცია ≤45%, გეგმიური აორტო-კორონარული შუნტირების წინ. დარტყმითი ინდექსი +10%. ინდუქციის შემდეგ: სისტემური სისხლძარღვოვანი რეზისტენტობის ინდექსი −28%, საშუალო არტერიული წნევა −10%, მარცხენა პარკუჭის ეფექტურობა +22%. კარგად იქნა ატანილი, გართულებების გარეშე."
pmid: "28804232"
doi: 10.1055/s-0036-1593825
