year: 2008
citation: "Lapanashvili L, Buziashvili YI, Matskeplishvili ST, Lobjanidze TG, Bockeria LA, Huber PP, Hess OM, Walpoth BH. Int J Artif Organs. 2008;31(3):244-51."
title: ECG-triggered skeletal muscle stimulation improves hemodynamics and physical performance of heart failure patients
design: "Контролируемое клиническое исследование, n = 55 (30 MCP, 25 контроль)"
findings: "30 минут в течение восьми дней. У пациентов с EF ниже 40%: EF +21%, ударный объём +13%, конечно-систолический объём −23% (все p < 0,001); продолжительность нагрузки +56%, дистанция ходьбы +72%. У пациентов с EF выше 40%: EF +6%, ударный объём +8% (p < 0,05)."
pmid: "18373318"
doi: 10.1177/039139880803100308
