year: 2017
citation: "Lapanashvili LV, Alshibaya MD, Veselova J, Bockeria LA. Int J Angiol. 2017;26(3):148-157."
title: Acute Beneficial Effects of Muscular Counterpulsation in Patients with Coronary Heart Diseases
design: "Проспективное пилотное исследование, n = 17 (10 MCP, 7 контроль)"
findings: "Один 15-минутный сеанс перед анестезией у пациентов с EF ≤45%, которым предстояло плановое аортокоронарное шунтирование. Ударный индекс +10%. После индукции анестезии: индекс общего периферического сосудистого сопротивления −28%, среднее артериальное давление −10%, эффективность работы левого желудочка +22%. Хорошая переносимость, осложнений не было."
pmid: "28804232"
doi: 10.1055/s-0036-1593825
