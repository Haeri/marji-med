year: 2004
citation: "Tozzi P, Corno AF, Lapanashvili LV, Von Segesser LK. Eur J Cardiothorac Surg. 2004;26(4):726-9."
title: "Muscular counterpulsation: preliminary results of a non-invasive alternative to intra-aortic balloon pump"
design: "Исследование на животных, 6 телят"
findings: "MCP и внутриаортальная баллонная контрпульсация оказывали одинаковое влияние на сердечный выброс и индекс ударной работы левого желудочка. MCP также снижала общее периферическое сосудистое сопротивление и увеличивала кровоток в бедренной артерии, не требуя сосудистого доступа и антикоагуляции."
pmid: "15450563"
doi: 10.1016/j.ejcts.2004.03.051
