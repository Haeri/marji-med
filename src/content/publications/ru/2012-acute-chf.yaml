year: 2012
citation: "Ostojic D, Seifert I, Pütz V, Bartsch S, Bitter T, Horstkotte D, Oldenburg O. Artif Organs. 2012;36(6):559-64."
title: Acute effects of muscular counterpulsation therapy on cardiac output and safety in patients with chronic heart failure
design: "Неконтролируемое клиническое исследование независимой группы, n = 22"
findings: "45 минут в течение трёх дней подряд при II и III функциональном классе по NYHA, средняя EF 29,6%. Во время лечения: сердечный выброс +2,08 л/мин (p < 0,05), общее периферическое сопротивление −336 дин·с/см⁵ (p < 0,05), ударный объём +8,35 мл (незначимо), частота сердечных сокращений +17,12 удара в минуту (p < 0,05). Кардиальные маркеры оставались в пределах нормы. У пациентов с имплантированными устройствами для лечения нарушений ритма не было неадекватного сенсинга и артефактов стимуляции."
pmid: "22145938"
doi: 10.1111/j.1525-1594.2011.01399.x
