year: 2009
citation: "Lapanashvili LV, Buziashvili YI, Matskeplishvili ST, Lobjanidze TG, Yoshina VI, Kamardinov DK, Tugeeva EF, Bockeria LA. J Card Surg. 2009;24(2):134-40."
title: Therapeutic value of muscular counterpulsation after coronary bypass grafting operation
design: "Рандомизированное исследование, n = 50 (30 MCP, 20 контроль)"
findings: "30 минут ежедневно в течение восьми послеоперационных дней. Общее периферическое сосудистое сопротивление −36% при MCP (p < 0,001), −16% в контрольной группе (p = 0,011). Послеоперационные осложнения у 1 пациента (3%) при MCP, у 7 (39%) в контрольной группе. Пребывание в стационаре 12,0 ± 4,6 дня при MCP, 16,8 ± 4,4 дня в контрольной группе (p < 0,001)."
pmid: "18793232"
doi: 10.1111/j.1540-8191.2008.00725.x
