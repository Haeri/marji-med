year: 2006
citation: "Shavianidze GO, Lapanashvili LV. Vopr Kurortol Fizioter Lech Fiz Kult. 2006;(5):11-4. In Russian."
title: Muscular contrapulsation in rehabilitation of patients with osteoarthrosis
design: "Клиническое исследование при остеоартрозе нижних конечностей"
findings: "MCP отдельно и в сочетании с радоновыми и йодобромными ваннами. Сообщалось об анальгезирующем и противовоспалительном эффектах с улучшением локомоторной функции, мышечного тонуса и гемодинамики. При сочетанном применении эти эффекты усиливались."
pmid: "17144553"
