year: 2007
citation: "Walpoth BH, Aregger C, Lapanashvili L, Mettler D, Carrel T, Hess OM. Int J Artif Organs. 2007;30(5):407-14."
title: ECG-triggered muscular counterpulsation for treatment of low cardiac output
design: "Исследование на животных, 8 свиней"
findings: "В контрольных условиях: лёгочное сосудистое сопротивление −18%, общее периферическое сосудистое сопротивление −11%. После бета-адреноблокады: частота сердечных сокращений +10%, сердечный индекс +17%, фракция выброса +5%, лёгочное сосудистое сопротивление −19%, общее периферическое сосудистое сопротивление −29%."
pmid: "17551904"
doi: 10.1177/039139880703000508
