figureTitle: Синхронизация мышечной контрпульсации с сердечным циклом
figureDescription: Кривая ЭКГ на протяжении трёх сердечных сокращений. После каждого зубца T, в раннюю диастолу, на мышцы голени и бедра подаётся короткий электрический стимул.
figureLabel: Рис. 1.
figureCaption: "Стимуляция следует за зубцом R с заданной задержкой (К-фактор) и приходится на раннюю диастолу. Схема: амплитуды приведены условно. Временные соотношения описаны по работам Tozzi 2004 и Лапанашвили 2008; пачка стимулов длительностью 75 мс — из исследования на животных Walpoth 2007."
