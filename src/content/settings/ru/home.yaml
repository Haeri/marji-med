title: Мышечная контрпульсация
description: Мышечная контрпульсация (MCP) — неинвазивный, синхронизированный с ЭКГ метод поддержки кровообращения. История, методика, области применения и клинические результаты.
reviewed: false
heading: Поддержка кровообращения с помощью собственных мышц организма
lede: Мышечная контрпульсация (MCP) — неинвазивный, синхронизированный с ЭКГ метод. Кожные электроды, управляемые портативным устройством с батарейным питанием, вызывают лёгкие сокращения мышц голеней в раннюю диастолу.
primaryLink: Как применяется метод
secondaryLink: Посмотреть результаты
howHeading: Как это работает
steps:
  - title: Регистрация
    text: Нагрудный ремень или ЭКГ-электроды регистрируют каждое сердечное сокращение, обеспечивая чёткий сигнал зубцов R и T.
  - title: Стимуляция
    text: С заданной задержкой после зубца R портативное устройство стимулирует одну из четырёх мышечных зон в раннюю диастолу, переходя к следующей зоне с каждым сердечным сокращением.
  - title: Компрессия
    text: Сокращающиеся мышцы сдавливают периферические артерии и вены во время диастолы. В опубликованных исследованиях сообщается о снижении общего периферического сосудистого сопротивления.
figuresHeading: Опубликованные результаты
figures:
  - value: −36%
    label: Общее периферическое сосудистое сопротивление после аортокоронарного шунтирования при MCP; в контрольной группе −16%
    source: Лапанашвили и соавт., J Card Surg 2009. Рандомизированное исследование, n = 50. p < 0,001 в группе MCP.
  - value: 28%
    label: 'Сокращение послеоперационного пребывания в стационаре: 12,0 дня при MCP, 16,8 дня в контрольной группе'
    source: Лапанашвили и соавт., J Card Surg 2009. Рандомизированное исследование, n = 50. p < 0,001.
  - value: +21%
    label: Средняя фракция выброса после восьми дней MCP при сердечной недостаточности с EF ниже 40%
    source: Лапанашвили и соавт., Int J Artif Organs 2008. n = 35 в этой группе (21 MCP, 14 контроль). p < 0,001.
figuresNote: Результаты небольших клинических исследований приведены в том виде, в каком они опубликованы.
