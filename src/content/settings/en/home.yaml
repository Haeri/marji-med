title: Muscular Counterpulsation
description: "Muscular counterpulsation (MCP) is a non-invasive, ECG-triggered method of circulatory support. History, methodology, applications and clinical results."
reviewed: false
heading: Circulatory support through the body’s own muscles
lede: "Muscular counterpulsation (MCP) is a non-invasive, ECG-triggered method. Skin electrodes produce light contractions of the calf and thigh muscles in early diastole, driven by a battery-powered portable device."
primaryLink: How it is applied
secondaryLink: See the results
howHeading: How it works
steps:
  - title: Sense
    text: A chest belt or ECG electrodes pick up each heartbeat, giving a sharp signal from the R and T waves.
  - title: Stimulate
    text: After a set delay from the R wave, a portable device stimulates one of four muscle zones in early diastole, moving to the next zone with each heartbeat.
  - title: Compress
    text: The contracting muscles compress peripheral arteries and veins during diastole. Published studies report lower systemic vascular resistance.
figuresHeading: Published findings
figures:
  - value: "−36%"
    label: "Systemic vascular resistance after bypass surgery with MCP, compared with −16% in controls"
    source: "Lapanashvili et al., J Card Surg 2009. Randomised, n = 50. p < 0.001 in the MCP group."
  - value: "28%"
    label: "Shorter postoperative hospital stay: 12.0 days with MCP, 16.8 days in controls"
    source: "Lapanashvili et al., J Card Surg 2009. Randomised, n = 50. p < 0.001."
  - value: "+21%"
    label: "Mean ejection fraction after eight days of MCP in heart failure with EF below 40%"
    source: "Lapanashvili et al., Int J Artif Organs 2008. n = 35 in this group (21 MCP, 14 controls). p < 0.001."
figuresNote: "Findings from small clinical studies, reported as published."
