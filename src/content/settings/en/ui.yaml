figureTitle: Timing of muscular counterpulsation within the cardiac cycle
figureDescription: An ECG trace over three heartbeats. After each T wave, in early diastole, a short electrical stimulus is delivered to the calf and thigh muscles.
figureLabel: Fig. 1.
figureCaption: "Stimulation follows the R wave after a set delay, the K-factor, and falls in early diastole. Schematic: amplitudes are illustrative. Timing as described in Tozzi 2004 and Lapanashvili 2008; 75 ms stimulus train from the animal study by Walpoth 2007."
