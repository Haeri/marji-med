title: კუნთოვანი კონტრპულსაცია
description: "კუნთოვანი კონტრპულსაცია (MCP) სისხლის მიმოქცევის მხარდაჭერის არაინვაზიური, ეკგ-ით ტრიგერირებული მეთოდია. ისტორია, მეთოდოლოგია, გამოყენება და კლინიკური შედეგები."
reviewed: false
heading: სისხლის მიმოქცევის მხარდაჭერა ორგანიზმის საკუთარი კუნთებით
lede: "კუნთოვანი კონტრპულსაცია (MCP) არაინვაზიური, ეკგ-ით ტრიგერირებული მეთოდია. კანის ელექტროდები ადრეულ დიასტოლაში იწვევს წვივისა და ბარძაყის კუნთების მსუბუქ შეკუმშვებს; მათ მართავს ბატარეაზე მომუშავე პორტატული მოწყობილობა."
primaryLink: როგორ გამოიყენება
secondaryLink: იხილეთ შედეგები
howHeading: როგორ მუშაობს
steps:
  - title: აღქმა
    text: გულმკერდის ღვედი ან ეკგ-ელექტროდები აფიქსირებს თითოეულ გულისცემას და იძლევა მკვეთრ სიგნალს R და T კბილებიდან.
  - title: სტიმულაცია
    text: R კბილიდან განსაზღვრული დაყოვნების შემდეგ პორტატული მოწყობილობა ადრეულ დიასტოლაში ასტიმულირებს ოთხი კუნთოვანი ზონიდან ერთ-ერთს და ყოველ გულისცემაზე მომდევნო ზონაზე გადადის.
  - title: კომპრესია
    text: შეკუმშული კუნთები დიასტოლის დროს აკომპრესირებს პერიფერიულ არტერიებსა და ვენებს. გამოქვეყნებულ კვლევებში აღწერილია სისტემური სისხლძარღვოვანი რეზისტენტობის შემცირება.
figuresHeading: გამოქვეყნებული შედეგები
figures:
  - value: "−36%"
    label: "სისტემური სისხლძარღვოვანი რეზისტენტობა აორტო-კორონარული შუნტირების შემდეგ MCP-ის ფონზე, საკონტროლო ჯგუფის −16%-თან შედარებით"
    source: "ლაპანაშვილი და სხვ., J Card Surg 2009. რანდომიზებული, n = 50. p < 0.001 MCP-ის ჯგუფში."
  - value: "28%"
    label: "უფრო ხანმოკლე პოსტოპერაციული ჰოსპიტალიზაცია: 12.0 დღე MCP-ის ჯგუფში, 16.8 დღე საკონტროლო ჯგუფში"
    source: "ლაპანაშვილი და სხვ., J Card Surg 2009. რანდომიზებული, n = 50. p < 0.001."
  - value: "+21%"
    label: "საშუალო განდევნის ფრაქცია რვადღიანი MCP-ის შემდეგ გულის უკმარისობის დროს, განდევნის ფრაქციით 40%-ზე დაბალი"
    source: "ლაპანაშვილი და სხვ., Int J Artif Organs 2008. ამ ჯგუფში n = 35 (21 MCP, 14 საკონტროლო). p < 0.001."
figuresNote: "მცირე კლინიკური კვლევების შედეგები, წარმოდგენილი ისე, როგორც გამოქვეყნდა."
